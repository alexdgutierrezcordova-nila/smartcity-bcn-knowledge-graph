[project]
name = "bcn-kg"
version = "0.1.0"
description = "Extracción, perfilado, limpieza, enlace y modelado RDF para Smart City Barcelona (CityBikes Bicing + Open-Meteo Air Quality CAMS)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.11.0",
    "ipykernel>=6.26.0",
    "rdflib>=7.0.0",
    "networkx>=3.2.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcn_kg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
